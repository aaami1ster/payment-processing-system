# Stack: app (Java 21) + PostgreSQL 18 + MongoDB 8
# Variables come from `.env` (see `.env.example`).
name: payment-processing-system

services:
  postgres:
    image: postgres:18-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # PG 18+ official images: mount parent dir (versioned data under /var/lib/postgresql/18/…)
    # Do NOT mount /var/lib/postgresql/data — that layout is for PG ≤17.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo:
    # Official mongo images are Ubuntu-based (no alpine tag)
    image: mongo:8
    container_name: payments-mongo
    environment:
      # Workaround: MongoDB 8 + Linux kernel 6.19–7.0.13 TCMalloc/rseq (SERVER-121912).
      # Required on current Docker Desktop LinuxKit kernels (e.g. 7.0.12).
      GLIBC_TUNABLES: ${MONGO_GLIBC_TUNABLES:-glibc.pthread.rseq=1}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Optional query-side cache (Phase 8). Start with:
  #   docker compose --profile redis up --build -d
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: payments-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app:
    build: .
    container_name: payments-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MONGODB_URI: ${MONGO_URI}
      SPRING_DATA_MONGODB_URI: ${MONGO_URI}
      PAYMENT_CACHE_USER_ENABLED: ${PAYMENT_CACHE_USER_ENABLED:-false}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  # Fresh volumes required when changing PostgreSQL major version
  postgres_data:
  mongo_data:
