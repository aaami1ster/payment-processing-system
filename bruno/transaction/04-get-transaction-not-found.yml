info:
  name: Get transaction not found
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/00000000-0000-0000-0000-000000000000"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 404", function() {
          expect(res.status).to.equal(404);
        });

        test("envelope failure shape", function() {
          expect(res.body.data).to.equal(null);
          expect(res.body.errors).to.be.an("array").that.is.not.empty;
          expect(res.body.errors.some(e => e.code === "NOT_FOUND")).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /api/v1/transactions/{id} — not found

  ## When available
  Phase 5+

  ## Expected
  - **HTTP** `404`
  - `data` = `null`
  - `errors[].code` = `NOT_FOUND`
