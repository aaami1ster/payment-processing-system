docs: |-
  # Transaction (Phases 3–5, optional list Phase 9)

  - `POST /api/v1/transactions` — process payment
  - `GET /api/v1/transactions/{id}` — fetch decision
  - `GET /api/v1/transactions` — cursor list (Phase 9)
  - `GET /api/v1/audit-logs` — Mongo audit export (optional companion)

  Business outcomes `APPROVED` / `FLAGGED` / `DECLINED` all return **HTTP 201**.
