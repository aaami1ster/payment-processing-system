info:
  name: Get transaction
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/{{transactionId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function() {
          expect(res.status).to.equal(200);
        });

        test("envelope OK with transaction", function() {
          expect(res.body.data).to.not.equal(null);
          expect(res.body.errors).to.be.an("array").that.is.empty;
          const id = res.body.data.transactionId || res.body.data.id;
          expect(id).to.equal(bru.getEnvVar("transactionId"));
          expect(["APPROVED", "FLAGGED", "DECLINED"]).to.include(res.body.data.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /api/v1/transactions/{id}

  Fetch a stored authorization decision.

  ## When available
  Phase 5+

  ## Success
  - **HTTP** `200`
  - `data` = transaction resource

  ## Errors
  | HTTP | `errors[].code` |
  | ---- | --------------- |
  | `404` | `NOT_FOUND` |
