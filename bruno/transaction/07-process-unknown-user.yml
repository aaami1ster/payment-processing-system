info:
  name: Process unknown user
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/transactions"
  headers:
    - name: Idempotency-Key
      value: "unknown-user-{{$guid}}"
  body:
    type: json
    data: |-
      {
        "amount": 100.00,
        "userId": "00000000-0000-0000-0000-000000000000",
        "merchantId": "{{merchantId}}",
        "category": "GROCERIES"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 404", function() {
          expect(res.status).to.equal(404);
        });

        test("USER_NOT_FOUND", function() {
          expect(res.body.data).to.equal(null);
          expect(res.body.errors.some(e => e.code === "USER_NOT_FOUND")).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # POST /api/v1/transactions — unknown user

  ## When available
  Phase 3+

  ## Expected
  - **HTTP** `404`
  - `errors[].code` = `USER_NOT_FOUND`
  - No transaction row created
