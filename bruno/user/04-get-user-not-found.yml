info:
  name: Get user not found
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/00000000-0000-0000-0000-000000000000"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 404", function() {
          expect(res.status).to.equal(404);
        });

        test("envelope: data null, errors present", function() {
          expect(res.body.data).to.equal(null);
          expect(res.body.errors).to.be.an("array").that.is.not.empty;
          expect(res.body.meta.requestId).to.be.a("string").that.is.not.empty;
        });

        test("stable not-found code", function() {
          const codes = res.body.errors.map(e => e.code);
          expect(codes.some(c => c === "USER_NOT_FOUND" || c === "NOT_FOUND")).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /api/v1/users/{id} — not found

  Negative test: unknown UUID returns 404 envelope (not an empty 200).

  ## When available
  Phase 1+

  ## Expected
  - **HTTP** `404`
  - `data` = `null`
  - `errors[]` with `USER_NOT_FOUND` or `NOT_FOUND`
  - `meta.requestId` present
