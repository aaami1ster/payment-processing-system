info:
  name: Get user
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function() {
          expect(res.status).to.equal(200);
        });

        test("envelope OK", function() {
          expect(res.body.data).to.not.equal(null);
          expect(res.body.errors).to.be.an("array").that.is.empty;
          expect(res.body.meta.requestId).to.be.a("string").that.is.not.empty;
        });

        test("returned id matches path", function() {
          const id = res.body.data.id || res.body.data.userId;
          expect(id).to.equal(bru.getEnvVar("userId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /api/v1/users/{id}

  Fetch a user profile by id.

  ## When available
  Phase 1+

  ## Path params
  | Param | Source |
  | ----- | ------ |
  | `id` | `{{userId}}` (from Create user) |

  ## Success
  - **HTTP** `200`
  - `data` = user resource
  - `errors` = `[]`

  ## Errors
  | HTTP | `errors[].code` |
  | ---- | --------------- |
  | `404` | `USER_NOT_FOUND` or `NOT_FOUND` |

  ## Prerequisite
  Run **Create user** first (or set `userId` in Local env).
