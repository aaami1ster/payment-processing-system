info:
  name: Create user
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users"
  body:
    type: json
    data: |-
      {
        "email": "{{sampleEmail}}",
        "kycStatus": "PENDING"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const existing = bru.getEnvVar("sampleEmail");
        if (!existing || existing.indexOf("+") === -1) {
          bru.setEnvVar("sampleEmail", "alice.bruno+" + Date.now() + "@example.com");
        }
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.data) {
          const id = res.body.data.id || res.body.data.userId;
          if (id) {
            bru.setEnvVar("userId", id);
          }
        }
    - type: tests
      code: |-
        test("HTTP 201 Created", function() {
          expect(res.status).to.equal(201);
        });

        test("envelope: data present, errors empty", function() {
          expect(res.body).to.have.property("data");
          expect(res.body.data).to.not.equal(null);
          expect(res.body.errors).to.be.an("array").that.is.empty;
          expect(res.body.meta).to.have.property("requestId");
        });

        test("user id and email returned", function() {
          const id = res.body.data.id || res.body.data.userId;
          expect(id).to.be.a("string").that.is.not.empty;
          expect(res.body.data.email).to.be.a("string");
        });

        test("default KYC PENDING", function() {
          expect(res.body.data.kycStatus).to.equal("PENDING");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # POST /api/v1/users

  Create a user profile.

  ## When available
  Phase 1+

  ## Request body

  | Field | Required | Notes |
  | ----- | -------- | ----- |
  | `email` | yes | Unique |
  | `kycStatus` | no | Default `PENDING` |

  `preApprovedTransactionLimit` starts as `null` (needed later for fraud Rule 1).

  ## Success
  - **HTTP** `201`
  - `data` = user resource (`id`, `email`, `kycStatus`, `preApprovedTransactionLimit`, `createdAt`)
  - `errors` = `[]`
  - `meta.requestId` always set

  ## Errors
  | HTTP | `errors[].code` | When |
  | ---- | --------------- | ---- |
  | `400` | `VALIDATION_ERROR` | Bad/missing fields (Bean Validation on DTO) |
  | `409` | `EMAIL_ALREADY_EXISTS` | Email already exists |

  ## Side effects
  Sets env `userId` for later requests.
