info:
  name: Readiness
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/actuator/health/readiness"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200 when Postgres is up", function() {
          expect(res.status).to.equal(200);
        });

        test("readiness UP", function() {
          expect(res.body.status).to.equal("UP");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /actuator/health/readiness

  Readiness probe — app can safely accept payment traffic.

  ## When available
  Phase 0+

  ## Success
  - **HTTP** `200`, `"status": "UP"` when PostgreSQL is reachable

  ## Failure
  - Non-200 / not UP if PostgreSQL is down (do not route payment traffic)

  ## Design note
  MongoDB is **not** required for readiness; audit projection can lag while payments continue.
