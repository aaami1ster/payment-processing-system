info:
  name: Aggregated health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/actuator/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function() {
          expect(res.status).to.equal(200);
        });

        test("status is UP", function() {
          expect(res.body).to.have.property("status");
          expect(res.body.status).to.equal("UP");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /actuator/health

  Aggregated health of the application.

  ## When available
  Phase 0+

  ## Success
  - **HTTP** `200`
  - Body includes `"status": "UP"` when the process and required dependencies are healthy

  ## Notes
  - Liveness = process healthy
  - Readiness = PostgreSQL up (required to process payments)
  - Mongo down → still READY (async audit only degraded)
