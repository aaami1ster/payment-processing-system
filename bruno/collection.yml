info:
  name: Payment Processing System

http:
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Request-Id
      value: "{{$guid}}"

docs: |-
  Collection-level defaults: JSON + `X-Request-Id` on every request.
  Business APIs use the standard `ApiResponse` envelope from the LLD.
