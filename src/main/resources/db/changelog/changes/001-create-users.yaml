databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: payment-processing-system
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: TEXT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: kyc_status
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: pre_approved_transaction_limit
                  type: NUMERIC(19,4)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
