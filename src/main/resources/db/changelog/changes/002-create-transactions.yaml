databaseChangeLog:
  - changeSet:
      id: 002-create-transactions
      author: payment-processing-system
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: merchant_id
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: rules_triggered
                  type: TEXT[]
              - column:
                  name: idempotency_key
                  type: TEXT
              - column:
                  name: request_fingerprint
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_transactions_user
        - sql:
            sql: ALTER TABLE transactions ADD CONSTRAINT chk_transactions_amount_positive CHECK (amount > 0)
        - sql:
            sql: ALTER TABLE transactions ADD CONSTRAINT chk_transactions_status CHECK (status IN ('APPROVED', 'FLAGGED', 'DECLINED'))
        - createIndex:
            indexName: idx_transaction_user_created
            tableName: transactions
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_transaction_user_status_created
            tableName: transactions
            columns:
              - column:
                  name: user_id
              - column:
                  name: status
              - column:
                  name: created_at
                  descending: true
        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_transaction_user_idempotency
              ON transactions(user_id, idempotency_key)
              WHERE idempotency_key IS NOT NULL
