spring:
  application:
    name: payment-processing-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${SPRING_DATASOURCE_USERNAME:payments}
    password: ${SPRING_DATASOURCE_PASSWORD:payments}
    hikari:
      connection-timeout: 2000

  jpa:
    open-in-view: false
    hibernate:
      # Schema owned by Liquibase (entities arrive in later phases)
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:mongodb://localhost:27017/payments_audit?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=2000}}
      # Do not create indexes during MongoTemplate construction — that would block startup if Mongo is down
      auto-index-creation: false
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

payment:
  outbox:
    publisher:
      enabled: true
      batch-size: 50
      poll-interval-ms: 1000
      mongo-timeout-ms: 2000
      circuit-failure-rate-threshold: 50
      circuit-sliding-window-size: 10
      circuit-wait-open-ms: 10000
  rate-limit:
    enabled: true
    user:
      capacity: 60
      window-seconds: 60
    merchant:
      capacity: 300
      window-seconds: 60
    ip:
      capacity: 120
      window-seconds: 60
  cache:
    user:
      # Optional query-side cache (Phase 8). Off by default — core stack needs no Redis.
      enabled: ${PAYMENT_CACHE_USER_ENABLED:false}
      ttl-seconds: 60
      key-prefix: "user:"
  webhooks:
    # Optional signed HTTP notifications (Phase 10). Off by default — authorize path never waits on HTTP.
    # Demo steps: README "Webhook demo (local Compose → host listener)".
    enabled: ${PAYMENT_WEBHOOKS_ENABLED:false}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    # Local demo subscriber (host listener on :9999). Override/clear for non-demo environments.
    subscribers:
      - id: local
        merchant-id: "*"
        target-url: http://host.docker.internal:9999/hooks
        secret: change-me
        active: true
    # Production-style example:
    # subscribers:
    #   - id: ops-global
    #     merchant-id: "*"
    #     target-url: https://hooks.example.com/payments
    #     secret: ${WEBHOOK_SECRET:change-me}
    #     events:
    #       - TRANSACTION_APPROVED
    #       - TRANSACTION_FLAGGED
    #       - TRANSACTION_DECLINED
    #     active: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Mongo is optional for readiness — payments stay available if audit projection lags
    mongo:
      enabled: false
    # Redis is optional (query cache only) — never block readiness
    redis:
      enabled: false
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

fraud:
  high-risk-categories:
    - CRYPTO
    - CASH_ADVANCE
  amount-without-approval-threshold: 10000
  high-risk-amount-threshold: 5000
  new-user-amount-threshold: 5000
  velocity-threshold: 3
  velocity-window-seconds: 60
  new-user-max-age-days: 30

logging:
  level:
    root: INFO
    com.example.payment: INFO
