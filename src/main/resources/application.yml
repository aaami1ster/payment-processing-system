spring:
  application:
    name: payment-processing-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${SPRING_DATASOURCE_USERNAME:payments}
    password: ${SPRING_DATASOURCE_PASSWORD:payments}
    hikari:
      connection-timeout: 2000

  jpa:
    open-in-view: false
    hibernate:
      # Schema owned by Liquibase (entities arrive in later phases)
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/payments_audit}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Mongo is optional for readiness — payments stay available if audit projection lags
    mongo:
      enabled: false
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,db

logging:
  level:
    root: INFO
    com.example.payment: INFO
